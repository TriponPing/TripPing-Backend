server:
  # 👈 새로 추가: Railway/Render 등 대부분의 호스팅은 컨테이너에 PORT 환경변수로 포트를 지정해줌.
  # 이 값이 없으면(로컬 실행) 그냥 8080을 씀 - 로컬/배포 둘 다 그대로 동작.
  port: ${PORT:8080}
  tomcat:
    uri-encoding: UTF-8
  # 👈 새로 추가: 로그인 세션 쿠키 설정.
  # 프론트와 백엔드가 서로 다른 도메인에 배포되면 세션 쿠키가 "서드파티 쿠키"가 되어
  # 브라우저가 기본값(SameSite=Lax)에서는 아예 보내지 않는다. 그러면 로그인은 성공해도
  # 바로 다음 요청에서 인증이 풀려 로그인 화면으로 계속 튕긴다(CORS 에러는 안 난다).
  #
  # 배포 환경에서는 COOKIE_SAME_SITE=none, COOKIE_SECURE=true 를 환경변수로 넣는다.
  # 로컬은 http라서 Secure 쿠키를 쓸 수 없으므로 기본값(lax/false)을 그대로 둔다.
  servlet:
    session:
      cookie:
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.yvenxvgkgcfbpvwerjvr
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 👈 새로 추가: Ping 후기 사진 업로드 저장 위치 (로컬 디스크). 클라우드 스토리지(S3 등)가 아직
# 안 붙어있어서 서버 로컬에 저장하고 /uploads/{filename}으로 서빙함 - 개발/로컬 테스트용.
# 나중에 배포 시엔 이 값을 영구 디스크 경로로 바꾸거나 S3 등으로 교체해야 함(서버 재배포하면
# 로컬 디스크 파일은 날아감).
